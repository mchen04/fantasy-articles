name: Publication checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  content-and-build:
    name: Content and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
